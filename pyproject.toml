[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-disclosure-spillovers-and-peer-return-prediction"
version = "0.1.0"
description = "Reproducible research on corporate disclosures and peer-stock returns"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.2",
  "numpy==2.5.4", "pandas==3.1.0", "pyarrow==26.0.0", "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
research = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<0.11",
]

[project.scripts]
earnings-study = "relay.cli:main"
prism = "relay.cli:main"
relay = "relay.cli:main"

[tool.setuptools.packages.find]
include = ["relay*"]
exclude = ["relay.tests*"]

[tool.setuptools.package-data]
relay = ["data/*.json", "data/*observations.csv.gz", "notebooks/*.ipynb"]
